[project]
name = "asr-stress-gym-worker"
version = "0.0.0"
description = "ASR Stress Gym worker: adapter host over a fixed HTTP surface (open/push/flush/restore/close/health)."
requires-python = ">=3.11"
# M0 was stdlib-only (http.server). M1 adds fastapi/uvicorn for the real
# open/push/flush/restore/close surface (docs/PROTOCOL.md). M5 adds one
# dependency per adapter as it lands: numpy, sherpa-onnx,
# faster-whisper / ctranslate2, onnxruntime.
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"] # httpx: FastAPI's TestClient dependency

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
