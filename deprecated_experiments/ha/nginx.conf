# HA profile: one nginx in front of two gateway instances.
#
# LAYER 4, not layer 7. Everything about that choice matters here:
#
#   * The client protocol is a WebSocket carrying binary frames with a
#     sequence number per frame. At L7, nginx would have to be told about
#     Upgrade/Connection headers, proxy_read_timeout would have to be
#     raised past any plausible silence, and any response buffering would
#     turn a 20ms partial into a batched one. At L4 none of that exists:
#     nginx forwards bytes.
#
#   * The dashboard's /api/events is Server-Sent Events, which an L7 proxy
#     will happily buffer by default — producing a dashboard that updates
#     in bursts every few seconds, or not at all. `proxy_buffering off`
#     fixes that IF you remember it. TCP passthrough cannot have the bug.
#
#   * There is nothing for an L7 proxy to do here anyway. No TLS
#     termination, no path routing, no header rewriting, no auth.
#
# least_conn, not round-robin, because these are long-lived streaming
# connections of wildly differing duration. Round-robin balances
# CONNECTION COUNTS at the moment of arrival, which for a 2-second clip
# and a 20-minute session are not remotely the same amount of work.
# least_conn at least tracks what is still open.

worker_processes 1;
events { worker_connections 4096; }

stream {
    log_format basic '$remote_addr [$time_local] $protocol $status '
                     '$bytes_sent $bytes_received $session_time "$upstream_addr"';
    access_log /dev/stdout basic;

    # --- the audio WebSocket -------------------------------------------
    #
    # Sticky for the life of the TCP connection, which is all the
    # stickiness this system needs: session state lives in the gateway
    # process that owns the socket, so a connection moving mid-stream
    # would lose it. That is exactly why the client-side replay ring
    # exists — see the note at the bottom of this file.
    upstream gateways_ws {
        least_conn;
        server gateway:7070 max_fails=2 fail_timeout=5s;
        server gateway-2:7070 max_fails=2 fail_timeout=5s;
    }

    server {
        listen 7070;
        proxy_pass gateways_ws;
        # Long, because a session is legitimately silent for minutes at a
        # time (the VAD gates it; no bytes flow). A short timeout here
        # would sever healthy sessions and look exactly like a gateway
        # crash. chaos scenario 10 streams 30s of silence on purpose.
        proxy_timeout 1h;
        proxy_connect_timeout 2s;
    }

    # --- the control plane / dashboard ----------------------------------
    #
    # A caveat worth stating rather than discovering: each gateway has its
    # own in-process Hub, so a dashboard opened through this port shows
    # ONE gateway's streams — whichever nginx picked. The fleet view and
    # the node graphs are fleet-wide and identical either way (both
    # gateways poll the same workers), but the stream list is not.
    #
    # Fixing that properly means either a shared store or fanning the SSE
    # feeds together, which is a real piece of work and not what the HA
    # profile is demonstrating. For a per-gateway view, hit 7001/7002
    # directly — both are published below.
    upstream gateways_http {
        least_conn;
        server gateway:7000 max_fails=2 fail_timeout=5s;
        server gateway-2:7000 max_fails=2 fail_timeout=5s;
    }

    server {
        listen 7000;
        proxy_pass gateways_http;
        # Longer than any single request, because /api/events is an open
        # SSE stream and not a request that completes.
        proxy_timeout 1h;
        proxy_connect_timeout 2s;
    }
}

# --- What this profile does and does not prove --------------------------
#
# It proves: a gateway can die and new sessions keep being served, with no
# client-side configuration change and no DNS dance.
#
# It does not prove: that a session in flight survives its gateway dying.
# It does not, and cannot without more. The gateway holds the audio
# journal and the checkpoint for its sessions in memory, so killing it
# takes both with it. The client sees the socket close and must reconnect,
# and the new gateway has no idea what it was doing.
#
# That is what the client-side replay ring is for (cmd/loadgen): the
# client retains recent frames and replays from its last ack on
# reconnect. It makes a gateway death recoverable at the cost of the
# transcript restarting from the last committed final, not from the last
# partial. The gateway-side alternative — replicating the journal between
# gateways — is a genuinely larger system and is deliberately out of scope
# (docs/DECISIONS.md).
