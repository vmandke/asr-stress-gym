# M3 adds: the router (gateway's WORKER_URLS), fault injection (each
# worker's supervisor admin port, 9001, mapped to a distinct host port so
# chaos scripts can reach it directly), and drops the now-unused
# COMPAT_KEY_HASH env var — the mock adapter derives its compatibility
# key from MODEL instead (worker/adapters/mock.py), so worker-a/worker-b
# sharing a MODEL value is what makes them same-model, not a separately
# hand-maintained hash that could drift from it.
#
# Not yet wired (added at their own milestone, per docs/implementation-plan.md,
# so nothing sits in this file half-configured and silently broken):
#   - bifrost                                                        -> M7
#   - the ha profile (nginx + gateway-2)                             -> M9 (docker-compose.ha.yml)
#
# Resource limits are pinned from the start (docs/build-plan.md "Reproducible
# capacity numbers") so later RTF/concurrency numbers are reproducible on any
# machine, not just this one.

x-worker-resources: &worker-resources
  cpus: "1.5"
  memory: 1536M

# One shared KV tier PER MODEL FAMILY, not one for the fleet.
#
# Blobs are opaque and the worker refuses a foreign compatibility key at
# load (422), so a single tier would be correct. It would not be isolated.
# A burst of large-family sessions sharing one byte ceiling with zipformer
# (1.09 MB) evicts zipformer state, and those
# sessions then take a 424 and have to replay — a cross-family blast
# radius created purely by co-tenancy. Separate tiers also give each
# family its own failure domain, and keep the compatibility key as a
# correctness backstop rather than the only wall.
#
# Production draws the same boundary: a Kubernetes InferencePool is the
# unit of deployment and scaling, so its cache tier is too.
x-kvtier: &kvtier
  build:
    context: .
    dockerfile: deploy/kvtier.Dockerfile
  healthcheck:
    test: ["CMD", "wget", "-qO-", "http://localhost:9500/health"]
    interval: 2s
    timeout: 2s
    retries: 15
    start_period: 2s
  deploy:
    resources:
      limits:
        cpus: "0.25"
        memory: 512M
  restart: "no"

services:
  gateway:
    build:
      context: .
      dockerfile: deploy/gateway.Dockerfile
    ports:
      # Host-side mapping only; the container listens on the canonical
      # 7070/7000 from docs/build-plan.md either way. Overridable because
      # macOS's AirPlay Receiver (ControlCenter) squats on host port 7000
      # by default from Monterey onward — a reviewer on macOS may need
      # GATEWAY_DASHBOARD_PORT=7001 (or disable AirPlay Receiver in System
      # Settings > General > AirDrop & Handoff) rather than hit a silent
      # bind failure. See README "Troubleshooting".
      - "${GATEWAY_WS_PORT:-7070}:7070"
      - "${GATEWAY_DASHBOARD_PORT:-7000}:7000"
    environment:
      DASHBOARD_ADDR: ":7000"
      # Admission envelope (internal/admission). Overridable from the
      # environment so a capacity run can lower it without a rebuild —
      # chaos scenario 9 ramps to 150% of whatever this says, and doing
      # that against the production default of 200 would mean 300 real
      # streams on a laptop to prove a property that holds at any scale.
      MAX_SESSIONS: "${MAX_SESSIONS:-200}"
      SOFT_SESSIONS: "${SOFT_SESSIONS:-150}"
      # M8 can turn this off for an honest cold-replay comparison; ordinary
      # gateway runs always create checkpoints.
      CHECKPOINTS_ENABLED: "${CHECKPOINTS_ENABLED:-true}"
      # The streaming control plane always goes through Bifrost. KV state
      # remains on the worker↔tier data plane, never in this request.
      BIFROST_URL: "${BIFROST_URL:-http://bifrost:8080}"
      # Which provider Bifrost routes a final to, and where it falls back.
      # Each worker is its own provider (bifrost/config.json).
      #
      BIFROST_MODEL: "${BIFROST_MODEL:-worker-zip-1/asr-1}"
      # The ordered fallback chain. This is the one Bifrost feature doing
      # real, non-duplicated work here: the gateway implements failover for
      # the STREAMING path only (internal/coord) and has nothing equivalent
      # for finals, so without this a dead primary means every final falls
      # back to the local direct path and Bifrost contributes nothing.
      BIFROST_FALLBACKS: "${BIFROST_FALLBACKS:-worker-ctc-1/asr-1}"
      # Opt-in: route ONLINE finals through Bifrost too. Off by default
      # because an online final has accumulated inference state behind it
      # that a stateless Bifrost request discards and recomputes — see
      # finalText in cmd/gateway/conn.go. Offline finals always route
      # through Bifrost when it is enabled, because there is no such state.
      BIFROST_FINALS: "${BIFROST_FINALS:-}"
      # Default runtime path: Bifrost routes only inside the selected
      # compatibility cohort and workers exchange state through its KV tier.
      STATELESS_STREAM: "${STATELESS_STREAM:-1}"
      # Where the load generator's control API lives, for the dashboard's
      # POST /api/load/{n}. Unset means the load buttons report "no load
      # generator configured" rather than failing silently.
      LOADGEN_URL: "${LOADGEN_URL:-http://loadgen:8090}"
      # The only path from the dashboard to lifecycle operations. The
      # manager is private to this Compose network and owns the Docker
      # socket; the gateway only verifies/adopts its returned worker.
      FLEET_MANAGER_URL: "${FLEET_MANAGER_URL:-http://fleet-manager:8091}"
      # id=url pairs, comma-separated (cmd/gateway/main.go's
      # parseWorkerURLs) — internal compose DNS names, port 9000 (the
      # worker's own port; 9001 is the supervisor's admin-only port, a
      # separate concern the router never talks to).
      # One worker per family is the live-demo default. The fleet manager
      # adds verified workers at runtime; there is no static replica-count
      # knob. Keeping the seed list explicit lets the router learn the
      # canonical compatibility cohort from a real health advertisement.
      WORKER_URLS: "${WORKER_URLS:-worker-zip-1=http://worker-zip-1:9000,worker-ctc-1=http://worker-ctc-1:9000}"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:7000/health"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1024M
    restart: "no"
    # Healthchecks, not sleeps (docs/build-plan.md "Startup ordering").
    # buildRouter tolerates a worker being absent at boot (retries, then
    # excludes it) — depends_on is about a clean FIRST run, not a
    # correctness requirement the gateway relies on.
    depends_on:
      worker-zip-1: { condition: service_healthy }
      worker-ctc-1: { condition: service_healthy }

  bifrost:
    # Pinned because the fleet manager uses Bifrost's provider API to add a
    # freshly healthy endpoint. `latest` makes that contract non-repeatable.
    image: maximhq/bifrost:v1.5.0
    ports:
      - "${BIFROST_PORT:-8080}:8080"
    volumes:
      # Bifrost reads /app/data/config.json and additionally CREATES
      # config.db and logs.db alongside it — it refuses to start on a
      # read-only APP_DIR. Those two files are git-ignored; config.json,
      # the part that is actually configuration, stays checked in.
      - ./bifrost:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/metrics"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    restart: "no"
    depends_on:
      worker-zip-1: { condition: service_healthy }
      worker-ctc-1: { condition: service_healthy }

  # Demo lifecycle plane. It receives a narrowly scoped add-family request,
  # creates only this repository's prebuilt worker image on this Compose
  # network, checks /health, then registers its endpoint with Bifrost. Do not
  # copy the Docker socket mount to Gateway or Bifrost.
  fleet-manager:
    build:
      context: .
      dockerfile: deploy/fleetmanager.Dockerfile
    environment:
      BIFROST_URL: "http://bifrost:8080"
      FLEET_NETWORK: "${COMPOSE_PROJECT_NAME:-asr-stress-gym}_default"
      FLEET_WORKER_IMAGE: "${FLEET_WORKER_IMAGE:-asr-stress-gym-worker:demo}"
      KV_DTYPE: "${KV_DTYPE:-fp32}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8091/health"]
      interval: 5s
      timeout: 2s
      retries: 1
      start_period: 1s
    restart: "no"
    depends_on:
      bifrost: { condition: service_healthy }

  # The shared KV-cache tiers: what makes routing through Bifrost possible
  # for STREAMING traffic, not just offline finals.
  #
  # While KV state lives inside one worker process, a session is pinned to
  # that worker and a load balancer in front of the fleet can only honour
  # the pin. Moving the state here — and putting a REFERENCE in the request
  # instead of the bytes — is what lets any worker in a model family serve
  # any chunk. See cmd/kvtier/main.go for the full argument, and
  # docs/BIFROST-KVCACHE.md for the measurement that rules out the obvious
  # alternative of shipping the tensors in the request (427x the audio).
  #
  # One per family (see the x-kvtier anchor). Ceilings are sized to the
  # family's own per-session state so each holds a comparable number of
  # sessions rather than a comparable number of bytes.
  #
  # Not in a profile, and no worker depends_on one: the worker treats its
  # tier as inert until a request carries a kv_mode, so an absent tier
  # degrades to the ordinary pinned path rather than failing a boot.
  kvtier-zip:
    <<: *kvtier
    command: ["-addr", ":9500", "-max-mb", "${KVTIER_ZIP_MAX_MB:-256}", "-ttl", "${KVTIER_TTL:-5m}"]
    ports:
      - "${KVTIER_ZIP_PORT:-9501}:9500"

  kvtier-ctc:
    <<: *kvtier
    command: ["-addr", ":9500", "-max-mb", "${KVTIER_CTC_MAX_MB:-512}", "-ttl", "${KVTIER_TTL:-5m}"]
    ports:
      - "${KVTIER_CTC_PORT:-9502}:9500"

  # --- the fleet: one KV-cache worker per family -----------------------
  #
  # The initial live shape is deliberately small: zip-1 and ctc-1. Each
  # owns a real, serializable KV cache. The dashboard's
  # fleet manager launches additional workers during a demo and admits them
  # only after they match this family's advertised compatibility key+tier.
  #
  #   zip-*                   zipformer transducer, 35 state tensors, 1.09 MB
  #   ctc-*                   NeMo FastConformer CTC, 3 tensors, 2.72 MB
  #
  # One seed worker per family. Additional workers are created by the fleet
  # manager from the dashboard, after they advertise a compatible KV schema.
  #
  worker-zip-1:
    build: { context: ., dockerfile: worker/Dockerfile }
    image: "${FLEET_WORKER_IMAGE:-asr-stress-gym-worker:demo}"
    environment:
      WORKER_ID: "worker-zip-1"
      MODEL: "zipformer-en-20M"
      ADAPTER: "zipformer_kv"
      KV_DTYPE: "${KV_DTYPE:-fp32}"
      # Shared KV tier. Set unconditionally: the worker treats it as inert
      # until a request actually carries a kv_mode, so the default pinned
      # path is unaffected by its presence (worker/kvtier.py).
      KVTIER_URL: "http://kvtier-zip:9500"
      KV_HOT_MAX: "${KV_HOT_MAX:-32}"
    ports:
      - "${WORKER_ZIP_1_ADMIN_PORT:-19001}:9001"
      - "${WORKER_ZIP_1_PORT:-18001}:9000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/health', timeout=2)"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 5s
    deploy:
      resources:
        limits: *worker-resources
    restart: "no"

  worker-ctc-1:
    build: { context: ., dockerfile: worker/Dockerfile }
    image: "${FLEET_WORKER_IMAGE:-asr-stress-gym-worker:demo}"
    environment:
      WORKER_ID: "worker-ctc-1"
      MODEL: "fastconformer-ctc"
      ADAPTER: "conformer_ctc_kv"
      KV_DTYPE: "${KV_DTYPE:-fp32}"
      # Shared KV tier. Set unconditionally: the worker treats it as inert
      # until a request actually carries a kv_mode, so the default pinned
      # path is unaffected by its presence (worker/kvtier.py).
      KVTIER_URL: "http://kvtier-ctc:9500"
      KV_HOT_MAX: "${KV_HOT_MAX:-32}"
    ports:
      - "${WORKER_CTC_1_ADMIN_PORT:-19003}:9001"
      - "${WORKER_CTC_1_PORT:-18003}:9000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/health', timeout=2)"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 5s
    deploy:
      resources:
        limits: *worker-resources
    restart: "no"

  loadgen:
    build:
      context: .
      dockerfile: deploy/loadgen.Dockerfile
    # M9: --control-addr makes loadgen start IDLE and serve a control API
    # instead of running one batch and exiting, so the stack comes up
    # quiet and the reviewer decides when to apply load. Every other flag
    # keeps the meaning docs/BENCH.md froze; without this flag the binary
    # behaves exactly as the benchmarks expect.
    command: ["--control-addr", ":8090", "--ws-url", "ws://gateway:7070/ws", "--corpus", "/corpus"]
    volumes:
      # The whole corpus tree, read-only. loadgen walks it recursively, so
      # this resolves to whatever the clone actually has: the twelve
      # committed short clips on a fresh checkout, plus corpus/large's
      # ~200 long clips once `make corpus` has been run. Mounting
      # corpus/large directly would be better traffic and would also mean
      # the loadgen container fails to start on a fresh clone, where that
      # directory does not exist (it is generated, and git-ignored).
      - ./corpus:/corpus:ro
    # No healthcheck: idle by design until driven from the dashboard
    # (POST /api/load/{n}, M9). Nothing depends on it being "healthy".
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    restart: "no"
