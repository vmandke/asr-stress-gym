# M3 adds: the router (gateway's WORKER_URLS), fault injection (each
# worker's supervisor admin port, 9001, mapped to a distinct host port so
# chaos scripts can reach it directly), and drops the now-unused
# COMPAT_KEY_HASH env var — the mock adapter derives its compatibility
# key from MODEL instead (worker/adapters/mock.py), so worker-a/worker-b
# sharing a MODEL value is what makes them same-model, not a separately
# hand-maintained hash that could drift from it.
#
# Not yet wired (added at their own milestone, per docs/implementation-plan.md,
# so nothing sits in this file half-configured and silently broken):
#   - bifrost                                                        -> M7
#   - the ha profile (nginx + gateway-2)                             -> M9 (docker-compose.ha.yml)
#
# Resource limits are pinned from the start (docs/build-plan.md "Reproducible
# capacity numbers") so later RTF/concurrency numbers are reproducible on any
# machine, not just this one.

x-worker-resources: &worker-resources
  cpus: "1.5"
  memory: 1536M

services:
  gateway:
    build:
      context: .
      dockerfile: deploy/gateway.Dockerfile
    ports:
      # Host-side mapping only; the container listens on the canonical
      # 7070/7000 from docs/build-plan.md either way. Overridable because
      # macOS's AirPlay Receiver (ControlCenter) squats on host port 7000
      # by default from Monterey onward — a reviewer on macOS may need
      # GATEWAY_DASHBOARD_PORT=7001 (or disable AirPlay Receiver in System
      # Settings > General > AirDrop & Handoff) rather than hit a silent
      # bind failure. See README "Troubleshooting".
      - "${GATEWAY_WS_PORT:-7070}:7070"
      - "${GATEWAY_DASHBOARD_PORT:-7000}:7000"
    environment:
      DASHBOARD_ADDR: ":7000"
      # id=url pairs, comma-separated (cmd/gateway/main.go's
      # parseWorkerURLs) — internal compose DNS names, port 9000 (the
      # worker's own port; 9001 is the supervisor's admin-only port, a
      # separate concern the router never talks to).
      # worker-e is optional: with no models profile buildRouter logs and
      # excludes it; with --profile models it becomes part of the fleet.
      # Keep comments outside the folded scalar — comments inside it become
      # literal text in WORKER_URLS.
      WORKER_URLS: >-
        worker-mock=http://worker-mock:9000,
        worker-a=http://worker-a:9000,
        worker-b=http://worker-b:9000,
        worker-c=http://worker-c:9000,
        worker-d=http://worker-d:9000,
        worker-e=http://worker-e:9000
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:7000/health"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1024M
    restart: "no"
    # Healthchecks, not sleeps (docs/build-plan.md "Startup ordering").
    # buildRouter tolerates a worker being absent at boot (retries, then
    # excludes it) — depends_on is about a clean FIRST run, not a
    # correctness requirement the gateway relies on.
    depends_on:
      worker-mock: { condition: service_healthy }
      worker-a: { condition: service_healthy }
      worker-b: { condition: service_healthy }
      worker-c: { condition: service_healthy }
      worker-d: { condition: service_healthy }

  worker-mock:
    build:
      context: .
      dockerfile: worker/Dockerfile
    environment:
      WORKER_ID: "worker-mock"
      MODEL: "mock-v1"
      ADAPTER: "mock" # the fleet's only serializable adapter -> the only worker where the warm-checkpoint tier is real (docs/DECISIONS.md)
    ports:
      - "${WORKER_MOCK_ADMIN_PORT:-19000}:9001" # supervisor: POST /admin/die|restore — see docs/PROTOCOL.md "Fault injection"
      - "${WORKER_MOCK_PORT:-18000}:9000" # the worker's own port: /health (active_sessions) observable from the host, e.g. by chaos scripts detecting which worker a session pinned to
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/health', timeout=2)"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    restart: "no"

  worker-a:
    build:
      context: .
      dockerfile: worker/Dockerfile
    environment:
      WORKER_ID: "worker-a"
      MODEL: "zipformer-en-20M"
      # Same ADAPTER as worker-b -> identical compatibility key -> same-model
      # failover (chaos scenario 2). From M5 the key comes from the loaded
      # weights and pinned runtime version (adapters/zipformer.py), not from
      # MODEL: two workers are same-model because they run the same adapter,
      # which is a fact about the image rather than a label that could drift
      # from it. MODEL is now display only.
      ADAPTER: "zipformer"
    ports:
      - "${WORKER_A_ADMIN_PORT:-19001}:9001"
      - "${WORKER_A_PORT:-18001}:9000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/health', timeout=2)"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 5s
    deploy:
      resources:
        limits: *worker-resources
    restart: "no"

  worker-b:
    build:
      context: .
      dockerfile: worker/Dockerfile
    environment:
      WORKER_ID: "worker-b"
      MODEL: "zipformer-en-20M"
      ADAPTER: "zipformer" # same as worker-a, on purpose — see above
    ports:
      - "${WORKER_B_ADMIN_PORT:-19002}:9001"
      - "${WORKER_B_PORT:-18002}:9000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/health', timeout=2)"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 5s
    deploy:
      resources:
        limits: *worker-resources
    restart: "no"

  worker-c:
    build:
      context: .
      dockerfile: worker/Dockerfile
    environment:
      WORKER_ID: "worker-c"
      MODEL: "conformer-ctc-en"
      # Different family from a/b (CTC, not transducer) -> different key ->
      # cross-model failover (chaos scenario 3). The plan named this
      # zipformer-ctc-en; no English streaming zipformer-CTC export is
      # published, so the equivalent English streaming CTC model stands in —
      # see adapters/conformer_ctc.py and docs/DECISIONS.md.
      ADAPTER: "conformer_ctc"
    ports:
      - "${WORKER_C_ADMIN_PORT:-19003}:9001"
      - "${WORKER_C_PORT:-18003}:9000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/health', timeout=2)"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 5s
    deploy:
      resources:
        limits: *worker-resources
    restart: "no"

  worker-d:
    build:
      context: .
      dockerfile: worker/Dockerfile
    environment:
      WORKER_ID: "worker-d"
      MODEL: "whisper-tiny.en"
      # Non-streaming: offline + finals only. The router must refuse it for
      # an online session rather than mis-serve one (a->d, M6). Same weights
      # as worker-e under a different runtime — see adapters/whisper_ct2.py.
      ADAPTER: "whisper_ct2"
    ports:
      - "${WORKER_D_ADMIN_PORT:-19004}:9001"
      - "${WORKER_D_PORT:-18004}:9000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/health', timeout=2)"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 5s
    deploy:
      resources:
        limits: *worker-resources
    restart: "no"

  # The opt-in half of the same-weights/different-runtime pair. Profiles
  # keep the default fleet at five workers; `--profile models` adds this
  # ONNX deployment beside worker-d's CTranslate2 deployment.
  worker-e:
    profiles: ["models"]
    build:
      context: .
      dockerfile: worker/Dockerfile
    environment:
      WORKER_ID: "worker-e"
      MODEL: "whisper-tiny.en"
      ADAPTER: "whisper_onnx" # same weights as d, different runtime -> K4
    ports:
      - "${WORKER_E_ADMIN_PORT:-19005}:9001"
      - "${WORKER_E_PORT:-18005}:9000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/health', timeout=2)"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 5s
    deploy:
      resources:
        limits: *worker-resources
    restart: "no"

  loadgen:
    build:
      context: .
      dockerfile: deploy/loadgen.Dockerfile
    # No healthcheck: idle by design until driven from the dashboard
    # (POST /api/load/{n}, M9). Nothing depends on it being "healthy".
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    restart: "no"
